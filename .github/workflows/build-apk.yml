name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk FotosDuplicadas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotosDuplicadas-apk
          path: FotosDuplicadas.apk
      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FotosDuplicadas.apk --title "Fotos Duplicadas (última versión)" --notes "APK compilada automáticamente desde main."
